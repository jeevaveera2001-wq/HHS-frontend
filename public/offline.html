<!doctype html>

<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#071827"
    />

    <link
      rel="icon"
      type="image/png"
      href="/pwa/favicon-64.png"
    />

    <title>
      You Are Offline | Hogenakkal Home Stays
    </title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        padding: 24px;
        display: grid;
        place-items: center;
        color: #102235;
        background:
          radial-gradient(
            circle at 10% 10%,
            #cffafe,
            transparent 26rem
          ),
          radial-gradient(
            circle at 90% 90%,
            #dbeafe,
            transparent 24rem
          ),
          #f4f8fb;
        font-family:
          Inter,
          Poppins,
          Arial,
          sans-serif;
      }

      .offline-card {
        width: min(470px, 100%);
        padding: 42px 32px;
        border: 1px solid #dce8ee;
        border-radius: 26px;
        background:
          rgba(255, 255, 255, 0.9);
        box-shadow:
          0 24px 60px
          rgba(15, 35, 50, 0.12);
        text-align: center;
      }

      .offline-card img {
        width: 105px;
        height: 105px;
        padding: 9px;
        border-radius: 24px;
        object-fit: contain;
        background: #071827;
        box-shadow:
          0 14px 30px
          rgba(7, 24, 39, 0.18);
      }

      .offline-card span {
        margin-top: 24px;
        display: block;
        color: #0891b2;
        font-size: 12px;
        font-weight: 850;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .offline-card h1 {
        margin: 10px 0;
        color: #071827;
        font-size:
          clamp(
            30px,
            8vw,
            42px
          );
      }

      .offline-card p {
        margin: 0 auto;
        max-width: 350px;
        color: #64748b;
        font-size: 14px;
        line-height: 1.7;
      }

      .offline-card button {
        min-height: 47px;
        margin-top: 27px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        color: #ffffff;
        background:
          linear-gradient(
            135deg,
            #0e7490,
            #06b6d4
          );
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        box-shadow:
          0 12px 25px
          rgba(8, 145, 178, 0.22);
      }

      .offline-card button:hover {
        transform:
          translateY(-2px);
      }

      @media (
        max-width: 500px
      ) {
        .offline-card {
          padding:
            35px 21px;
          border-radius: 21px;
        }

        .offline-card img {
          width: 88px;
          height: 88px;
        }
      }
    </style>
  </head>

  <body>
    <main class="offline-card">
      <img
        src="/pwa/icon-192.png"
        alt="Hogenakkal Home Stays"
      />

      <span>
        Connection unavailable
      </span>

      <h1>
        You are offline
      </h1>

      <p>
        Please check your internet
        connection and try again to
        continue exploring Hogenakkal
        stays.
      </p>

      <button
        type="button"
        onclick="window.location.reload()"
      >
        Try Again
      </button>
    </main>
  </body>
</html>
